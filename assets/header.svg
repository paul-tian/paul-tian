<svg xmlns="http://www.w3.org/2000/svg" width="840" height="168" viewBox="0 0 840 168" role="img" aria-labelledby="title description">
  <title id="title">Yuzhe Tian</title>
  <desc id="description">Paul's GitHub profile. Two sensor traces cross a coordinate grid.</desc>
  <style>
    .paper { fill: #f8f6ef; }
    .ink { fill: #182731; }
    .label { fill: #286963; }
    .edge { fill: none; stroke: #d2d8cf; }
    .grid { fill: none; stroke: #738c88; opacity: .22; }
    .accent { stroke: #087568; }
    .secondary { stroke: #557984; }
    .sample { fill: #d38b38; stroke: #f8f6ef; }
    @media (prefers-color-scheme: dark) {
      .paper { fill: #111c26; }
      .ink { fill: #f5f0e5; }
      .label { fill: #85d5c6; }
      .edge { stroke: #36484f; }
      .grid { stroke: #a5bfba; }
      .accent { stroke: #72d6bf; }
      .secondary { stroke: #87a7b2; }
      .sample { fill: #f0b76d; stroke: #111c26; }
    }
  </style>
  <defs>
    <pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse">
      <path class="grid" d="M22 0H0v22"/>
    </pattern>
    <clipPath id="plot"><rect x="515" y="19" width="300" height="130" rx="5"/></clipPath>
  </defs>
  <rect class="paper" x=".5" y=".5" width="839" height="167" rx="12"/>
  <rect class="edge" x=".5" y=".5" width="839" height="167" rx="12"/>
  <text class="ink" x="36" y="90" font-family="'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="64" font-weight="650" letter-spacing="-2">Yuzhe Tian</text>
  <text class="label" x="39" y="127" font-family="'IBM Plex Mono', Menlo, Consolas, monospace" font-size="22">@paul-tian</text>
  <g clip-path="url(#plot)">
    <rect x="515" y="19" width="300" height="130" fill="url(#grid)"/>
    <path class="secondary" d="M509 115q21 0 30-13t24-13q16 0 26 15t25 15q15 0 28-24t30-24q16 0 27 18t29 18q13 0 25-10t24-10h44" fill="none" stroke-width="2.25" stroke-dasharray="3 5" stroke-linecap="round"/>
    <path class="accent" d="M509 86h21q15 0 25 7t21 7q15 0 23-21t18-21q11 0 18 31t20 31q12 0 23-44t25-44q12 0 22 22t24 22q11 0 22-11t23-11h28" fill="none" stroke-width="3.6" stroke-linecap="round"/>
    <circle class="sample" cx="703" cy="32" r="6.5" stroke-width="2.5"/>
  </g>
</svg>
