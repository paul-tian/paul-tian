name: Refresh profile cards

on:
  workflow_dispatch:
  schedule:
    - cron: '17 19 * * *'

permissions:
  contents: write

concurrency:
  group: refresh-profile-cards
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Render cards from public GitHub activity
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/contributions.py
          python3 scripts/activity.py
      - name: Publish changed cards
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add -- assets/activity-{light,dark}.svg assets/contributions-{light,dark}.svg
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Refresh public profile cards'
          gh auth setup-git
          git push origin "HEAD:$GITHUB_REF_NAME"
